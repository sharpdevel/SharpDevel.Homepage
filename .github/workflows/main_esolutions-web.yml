# Deploys the homepage to the Azure App Service esolutions-web (tobiasmundt.de).
# Mirrors the pwdsafe setup: GitHub OIDC via the oidc-msi-9293 managed identity,
# legacy zipdeploy API (known-good for the live-websites apps).

name: Build and deploy ASP.Net Core app to Azure Web App - esolutions-web

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: dotnet publish
        run: dotnet publish SharpDevel.Homepage.UI/SharpDevel.Homepage.UI.csproj -c Release -o "${{ github.workspace }}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ github.workspace }}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        run: |
          zip -qr deploy.zip .
          az webapp deployment source config-zip --name esolutions-web --resource-group live-websites --src deploy.zip
